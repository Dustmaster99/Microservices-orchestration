apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: fiap-microservices

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service

          
          image: 657010996850.dkr.ecr.us-east-1.amazonaws.com/fiap-microservices/auth-service:9836061 


          ports:
            - containerPort: 8001

          envFrom:
            - secretRef:
                name: auth-secret

          env:
            - name: OTEL_SERVICE_NAME
              value: "auth-service"

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "otel-collector.monitoring.svc.cluster.local:4318"

            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"

            - name: OTEL_TRACES_EXPORTER
              value: "otlp"

            - name: OTEL_METRICS_EXPORTER
              value: "otlp"

            - name: SERVICE_VERSION
              value: "1.0.0"

            - name: ENVIRONMENT
              value: "fiap-lab3"

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: fiap-microservices

spec:
  type: ClusterIP

  selector:
    app: auth-service

  ports:
    - port: 8001
      targetPort: 8001