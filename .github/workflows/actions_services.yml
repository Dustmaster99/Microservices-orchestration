name: monorepo-microservices-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1

jobs:
  build-test:
    name: Build & Unit Test - ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: analytics-service
            path: analytics-service
            language: python
            ecr_repository: fiap-microservices/analytics-service
          - name: auth-service
            path: auth-service
            language: python
            ecr_repository: fiap-microservices/auth-service
          - name: evaluation-service
            path: evaluation-service
            language: go
            ecr_repository: fiap-microservices/evaluation-service
          - name: flag-service
            path: flag-service
            language: python
            ecr_repository: fiap-microservices/flag-service
          - name: targeting-service
            path: targeting-service
            language: python
            ecr_repository: fiap-microservices/targeting-service

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        if: matrix.service.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Go
        if: matrix.service.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Python dependencies
        if: matrix.service.language == 'python'
        working-directory: ${{ matrix.service.path }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest

      - name: Run Python unit tests
        if: matrix.service.language == 'python'
        working-directory: ${{ matrix.service.path }}
        env:
          AWS_REGION: us-east-1
          AWS_SQS_URL: https://example.com/dummy-queue
          AWS_DYNAMODB_TABLE: dummy-table
        run: |
          if [ -d tests ]; then
            pytest -v
          else
            echo "No tests directory found. Skipping tests."
          fi

      - name: Download Go dependencies
        if: matrix.service.language == 'go'
        working-directory: ${{ matrix.service.path }}
        run: go mod download

      - name: Run Go unit tests
        if: matrix.service.language == 'go'
        working-directory: ${{ matrix.service.path }}
        run: go test -v ./...

  lint:
    name: Linter / Static Analysis - ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: analytics-service
            path: analytics-service
            language: python
            ecr_repository: fiap-microservices/analytics-service
          - name: auth-service
            path: auth-service
            language: python
            ecr_repository: fiap-microservices/auth-service
          - name: evaluation-service
            path: evaluation-service
            language: go
            ecr_repository: fiap-microservices/evaluation-service
          - name: flag-service
            path: flag-service
            language: python
            ecr_repository: fiap-microservices/flag-service
          - name: targeting-service
            path: targeting-service
            language: python
            ecr_repository: fiap-microservices/targeting-service

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        if: matrix.service.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Go
        if: matrix.service.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Python lint tools
        if: matrix.service.language == 'python'
        working-directory: ${{ matrix.service.path }}
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8

      - name: Run flake8
        if: matrix.service.language == 'python'
        working-directory: ${{ matrix.service.path }}
        run: flake8 .

      - name: Run pylint
        if: matrix.service.language == 'python'
        working-directory: ${{ matrix.service.path }}
        run: |
          find . -name "*.py" -not -path "./venv/*" -not -path "./.venv/*" | xargs pylint

      - name: Run golangci-lint
        if: matrix.service.language == 'go'
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59
          working-directory: ${{ matrix.service.path }}
          args: --timeout=5m

  security-scan:
    name: Security Scan (SAST & SCA) - ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: analytics-service
            path: analytics-service
            language: python
            ecr_repository: fiap-microservices/analytics-service
          - name: auth-service
            path: auth-service
            language: python
            ecr_repository: fiap-microservices/auth-service
          - name: evaluation-service
            path: evaluation-service
            language: go
            ecr_repository: fiap-microservices/evaluation-service
          - name: flag-service
            path: flag-service
            language: python
            ecr_repository: fiap-microservices/flag-service
          - name: targeting-service
            path: targeting-service
            language: python
            ecr_repository: fiap-microservices/targeting-service

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        if: matrix.service.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Go
        if: matrix.service.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Bandit
        if: matrix.service.language == 'python'
        run: pip install bandit

      - name: Run Bandit (Python SAST)
        if: matrix.service.language == 'python'
        working-directory: ${{ matrix.service.path }}
        run: bandit -r . -ll

      - name: Install Gosec
        if: matrix.service.language == 'go'
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run Gosec (Go SAST)
        if: matrix.service.language == 'go'
        working-directory: ${{ matrix.service.path }}
        run: |
          "$(go env GOPATH)/bin/gosec" ./...

      - name: Run Trivy FS (SCA) - fail on CRITICAL
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: ${{ matrix.service.path }}
          severity: CRITICAL
          exit-code: 1

  docker-build-scan-push:
    name: Docker Build & Push - ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: [build-test, lint, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: analytics-service
            path: analytics-service
            language: python
            ecr_repository: fiap-microservices/analytics-service
          - name: auth-service
            path: auth-service
            language: python
            ecr_repository: fiap-microservices/auth-service
          - name: evaluation-service
            path: evaluation-service
            language: go
            ecr_repository: fiap-microservices/evaluation-service
          - name: flag-service
            path: flag-service
            language: python
            ecr_repository: fiap-microservices/flag-service
          - name: targeting-service
            path: targeting-service
            language: python
            ecr_repository: fiap-microservices/targeting-service

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set short SHA tag
        id: vars
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ matrix.service.ecr_repository }}:${IMAGE_TAG} \
            ${{ matrix.service.path }}

      - name: Scan Docker image with Trivy - fail on CRITICAL
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ matrix.service.ecr_repository }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL
          exit-code: 1

      - name: Tag Docker image for ECR
        run: |
          docker tag \
            ${{ matrix.service.ecr_repository }}:${IMAGE_TAG} \
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.service.ecr_repository }}:${IMAGE_TAG}

      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.service.ecr_repository }}:${IMAGE_TAG}
