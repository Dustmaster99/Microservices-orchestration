apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: fiap-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
        - name: analytics-service
          image: 657010996850.dkr.ecr.us-east-1.amazonaws.com/fiap-microservices/analytics-service:d32e518
          ports:
            - containerPort: 8005
          envFrom:
            - secretRef:
                name: analytics-secret
            - secretRef:
                name: aws-credentials
          env:
            - name: OTEL_SERVICE_NAME
              value: "analytics-service"

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.monitoring.svc.cluster.local:4318"

            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"

            - name: OTEL_METRICS_EXPORTER
              value: "otlp"

            - name: OTEL_TRACES_EXPORTER
              value: "otlp"

            - name: SERVICE_VERSION
              value: "1.0.0"

            - name: ENVIRONMENT
              value: "fiap-lab3"
          resources:
            requests:
              cpu: "100m"
            limits:
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: fiap-microservices
spec:
  type: ClusterIP
  selector:
    app: analytics-service
  ports:
    - port: 8005
      targetPort: 8005