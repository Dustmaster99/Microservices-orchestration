apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: fiap-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: 654654184825.dkr.ecr.us-east-1.amazonaws.com/fiap-microservices/auth-service:9e50c36
          ports:
            - containerPort: 8001
          envFrom:
            - secretRef:
                name: auth-secret
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: fiap-microservices
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - port: 8001
      targetPort: 8001
#kubectl apply -f auth-service-deploy.yaml