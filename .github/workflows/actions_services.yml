name: monorepo-microservices-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: gitops-main
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

permissions:
  contents: write

jobs:
  build-test:
    name: Build & Unit Test - ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: analytics-service
            path: analytics-service
            language: python
            ecr_repository: fiap-microservices/analytics-service
          - name: auth-service
            path: auth-service
            language: go
            ecr_repository: fiap-microservices/auth-service
          - name: evaluation-service
            path: evaluation-service
            language: go
            ecr_repository: fiap-microservices/evaluation-service
          - name: flag-service
            path: flag-service
            language: python
            ecr_repository: fiap-microservices/flag-service
          - name: targeting-service
            path: targeting-service
            language: python
            ecr_repository: fiap-microservices/targeting-service

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        if: matrix.service.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Go
        if: matrix.service.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Python dependencies
        if: matrix.service.language == 'python'
        working-directory: ${{ matrix.service.path }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest

      - name: Run Python unit tests
        if: matrix.service.language == 'python'
        working-directory: ${{ matrix.service.path }}
        env:
          AWS_REGION: us-east-1
          AWS_SQS_URL: https://example.com/dummy-queue
          AWS_DYNAMODB_TABLE: dummy-table
          DATABASE_URL: postgresql://user:pass@localhost:5432/testdb
          AUTH_SERVICE_URL: http://localhost:8001
        run: |
          if [ -d tests ]; then
            pytest -v
          else
            echo "No tests directory found. Skipping tests."
          fi

      - name: Download Go dependencies
        if: matrix.service.language == 'go'
        working-directory: ${{ matrix.service.path }}
        run: go mod download

      - name: Run Go unit tests
        if: matrix.service.language == 'go'
        working-directory: ${{ matrix.service.path }}
        run: go test -v ./...

  lint:
    name: Linter / Static Analysis - ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: analytics-service
            path: analytics-service
            language: python
            ecr_repository: fiap-microservices/analytics-service
          - name: auth-service
            path: auth-service
            language: go
            ecr_repository: fiap-microservices/auth-service
          - name: evaluation-service
            path: evaluation-service
            language: go
            ecr_repository: fiap-microservices/evaluation-service
          - name: flag-service
            path: flag-service
            language: python
            ecr_repository: fiap-microservices/flag-service
          - name: targeting-service
            path: targeting-service
            language: python
            ecr_repository: fiap-microservices/targeting-service

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        if: matrix.service.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Go
        if: matrix.service.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Python lint tools
        if: matrix.service.language == 'python'
        working-directory: ${{ matrix.service.path }}
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8

      - name: Run flake8 - non-blocking
        if: matrix.service.language == 'python'
        working-directory: ${{ matrix.service.path }}
        run: |
          if ! flake8 . --max-line-length=120 --extend-ignore=E402,W293,W291,E302,E305,E501,W292,E261,E701; then
            echo "::warning::Flake8 found issues in ${{ matrix.service.name }}, but the pipeline will continue."
          fi

      - name: Run pylint - non-blocking
        if: matrix.service.language == 'python'
        working-directory: ${{ matrix.service.path }}
        run: |
          PY_FILES=$(find . -name "*.py" -not -path "./venv/*" -not -path "./.venv/*")
          if [ -n "$PY_FILES" ]; then
            if ! echo "$PY_FILES" | xargs pylint --disable=import-error,missing-module-docstring,missing-function-docstring,wrong-import-position,trailing-whitespace,missing-final-newline,broad-exception-caught,logging-fstring-interpolation,invalid-envvar-default,wrong-import-order,multiple-statements,line-too-long,invalid-name,unused-argument,global-statement,too-many-statements; then
              echo "::warning::Pylint found issues in ${{ matrix.service.name }}, but the pipeline will continue."
            fi
          else
            echo "No Python files found. Skipping pylint."
          fi

      - name: Run golangci-lint - non-blocking
        if: matrix.service.language == 'go'
        continue-on-error: true
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59
          working-directory: ${{ matrix.service.path }}
          args: --timeout=5m --disable errcheck --disable staticcheck --disable typecheck

  security-scan:
    name: Security Scan (SAST & SCA) - ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: analytics-service
            path: analytics-service
            language: python
            ecr_repository: fiap-microservices/analytics-service
          - name: auth-service
            path: auth-service
            language: go
            ecr_repository: fiap-microservices/auth-service
          - name: evaluation-service
            path: evaluation-service
            language: go
            ecr_repository: fiap-microservices/evaluation-service
          - name: flag-service
            path: flag-service
            language: python
            ecr_repository: fiap-microservices/flag-service
          - name: targeting-service
            path: targeting-service
            language: python
            ecr_repository: fiap-microservices/targeting-service

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        if: matrix.service.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Go
        if: matrix.service.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Bandit
        if: matrix.service.language == 'python'
        run: pip install bandit

      - name: Run Bandit (Python SAST) - non-blocking
        if: matrix.service.language == 'python'
        working-directory: ${{ matrix.service.path }}
        run: |
          if ! bandit -r . -ll -s B104,B608; then
            echo "::warning::Bandit found security issues in ${{ matrix.service.name }}, but the pipeline will continue."
          fi

      - name: Install Gosec
        if: matrix.service.language == 'go'
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run Gosec (Go SAST) - non-blocking
        if: matrix.service.language == 'go'
        working-directory: ${{ matrix.service.path }}
        run: |
          if ! "$(go env GOPATH)/bin/gosec" -exclude=G104,G114,G401,G505,G706,G704 ./...; then
            echo "::warning::Gosec found security issues in ${{ matrix.service.name }}, but the pipeline will continue."
          fi

      - name: Run Trivy FS (SCA) - non-blocking
        id: trivy_fs
        continue-on-error: true
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: ${{ matrix.service.path }}
          severity: CRITICAL
          exit-code: 1

      - name: Warn if Trivy FS found vulnerabilities
        if: steps.trivy_fs.outcome == 'failure'
        run: |
          echo "::warning::Trivy found CRITICAL vulnerabilities in ${{ matrix.service.name }}, but the pipeline will continue."

  docker-build-scan-push:
    name: Docker Build & Push - ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: [build-test, lint, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: analytics-service
            path: analytics-service
            language: python
            ecr_repository: fiap-microservices/analytics-service
          - name: auth-service
            path: auth-service
            language: go
            ecr_repository: fiap-microservices/auth-service
          - name: evaluation-service
            path: evaluation-service
            language: go
            ecr_repository: fiap-microservices/evaluation-service
          - name: flag-service
            path: flag-service
            language: python
            ecr_repository: fiap-microservices/flag-service
          - name: targeting-service
            path: targeting-service
            language: python
            ecr_repository: fiap-microservices/targeting-service

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set short SHA tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ matrix.service.ecr_repository }}:${IMAGE_TAG} \
            ${{ matrix.service.path }}

      - name: Scan Docker image with Trivy - non-blocking
        id: trivy_image
        continue-on-error: true
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ matrix.service.ecr_repository }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL
          exit-code: 1

      - name: Warn if Trivy image scan found vulnerabilities
        if: steps.trivy_image.outcome == 'failure'
        run: |
          echo "::warning::Trivy found CRITICAL vulnerabilities in Docker image ${{ matrix.service.ecr_repository }}:${{ env.IMAGE_TAG }}, but the pipeline will continue."

      - name: Tag Docker image for ECR
        run: |
          docker tag \
            ${{ matrix.service.ecr_repository }}:${IMAGE_TAG} \
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.service.ecr_repository }}:${IMAGE_TAG}

      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.service.ecr_repository }}:${IMAGE_TAG}

  sync-redis-image:
    name: Sync Redis official image to ECR
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull official Redis image
        run: docker pull redis:7

      - name: Tag Redis image for ECR
        run: |
          docker tag redis:7 ${{ steps.login-ecr.outputs.registry }}/fiap-microservices/redis:7

      - name: Push Redis image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/fiap-microservices/redis:7

  update-gitops-manifests:
    name: Update GitOps manifests
    runs-on: ubuntu-latest
    needs: [docker-build-scan-push, sync-redis-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync with latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Set short SHA tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Update all GitOps manifests
        run: |
          REGISTRY="657010996850.dkr.ecr.us-east-1.amazonaws.com"

          sed -i "s#image: .*analytics-service:.*#image: ${REGISTRY}/fiap-microservices/analytics-service:${IMAGE_TAG}#g" "Manifestos kubernets/manifestos-services/analytics-service-manifest/analytics-service-deploy.yaml"
          sed -i "s#image: .*auth-service:.*#image: ${REGISTRY}/fiap-microservices/auth-service:${IMAGE_TAG}#g" "Manifestos kubernets/manifestos-services/auth-service-manifest/auth-service-deploy.yaml"
          sed -i "s#image: .*evaluation-service:.*#image: ${REGISTRY}/fiap-microservices/evaluation-service:${IMAGE_TAG}#g" "Manifestos kubernets/manifestos-services/evaluation-service-manifest/evaluation-service-deploy.yaml"
          sed -i "s#image: .*flag-service:.*#image: ${REGISTRY}/fiap-microservices/flag-service:${IMAGE_TAG}#g" "Manifestos kubernets/manifestos-services/flag-service-manifest/flag-service-deploy.yaml"
          sed -i "s#image: .*targeting-service:.*#image: ${REGISTRY}/fiap-microservices/targeting-service:${IMAGE_TAG}#g" "Manifestos kubernets/manifestos-services/targeting-service-manifest/targeting-service-deploy.yaml"
          sed -i "s#image: .*redis:.*#image: ${REGISTRY}/fiap-microservices/redis:7#g" "Manifestos kubernets/manifestos-services/redis-service/redis.yaml"

      - name: Commit changes
        run: |
          git add "Manifestos kubernets/manifestos-services"
          git diff --cached --quiet || git commit -m "Update GitOps image tags to ${IMAGE_TAG}"

      - name: Push changes
        run: |
          git push origin HEAD:main